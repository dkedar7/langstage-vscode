<!DOCTYPE html>
<!--
  Webview harness (build plan M5, first cut): the panel's real bundle, dist/webview/main.js,
  in a plain page. `acquireVsCodeApi()` is stubbed: `ui/ready` is answered with the
  `restore` message in restore.js (written by screenshot.js from a real-sidecar run), and
  everything the UI posts is kept in window.__sent. The --vscode-* variables below are
  VS Code's Dark Modern values, so it looks like the editor. Test-only; not in the VSIX.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LangStage panel harness</title>
<link rel="stylesheet" href="../../dist/webview/main.css">
<style>
  :root {
    --vscode-font-family: "Segoe UI", system-ui, sans-serif;
    --vscode-font-size: 13px;
    --vscode-editor-font-family: Consolas, "Courier New", monospace;
    --vscode-foreground: #cccccc;
    --vscode-descriptionForeground: #9d9d9d;
    --vscode-sideBar-background: #181818;
    --vscode-editor-background: #1f1f1f;
    --vscode-editorWidget-background: #202020;
    --vscode-widget-border: #313131;
    --vscode-panel-border: #2b2b2b;
    --vscode-textCodeBlock-background: #2b2b2b;
    --vscode-list-hoverBackground: #2a2d2e;
    --vscode-testing-iconPassed: #73c991;
    --vscode-errorForeground: #f85149;
    --vscode-editorWarning-foreground: #cca700;
    --vscode-focusBorder: #0078d4;
    --vscode-progressBar-background: #0078d4;
    --vscode-textLink-foreground: #4daafc;
    --vscode-textLink-activeForeground: #4daafc;
    --vscode-button-background: #0078d4;
    --vscode-button-foreground: #ffffff;
    --vscode-button-hoverBackground: #026ec1;
    --vscode-button-secondaryBackground: #313131;
    --vscode-button-secondaryForeground: #cccccc;
    --vscode-button-secondaryHoverBackground: #3c3c3c;
    --vscode-input-background: #313131;
    --vscode-input-foreground: #cccccc;
    --vscode-input-border: #3c3c3c;
    --vscode-input-placeholderForeground: #989898;
    --vscode-inputValidation-errorBackground: #5a1d1d;
    --vscode-inputValidation-errorBorder: #be1100;
    --vscode-toolbar-hoverBackground: #5a5d5e50;
  }
</style>
</head>
<body>
<div id="root"></div>
<script src="restore.js"></script>
<script>
  window.__sent = [];
  window.acquireVsCodeApi = () => ({
    postMessage(m) {
      window.__sent.push(m);
      if (m.type === 'ui/ready' && window.__RESTORE__) {
        setTimeout(() => window.postMessage(window.__RESTORE__, '*'));
      }
    },
    getState() { return undefined; },
    setState() {},
  });
</script>
<script src="../../dist/webview/main.js"></script>
</body>
</html>
